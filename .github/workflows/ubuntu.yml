# Main doc: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/introduction-to-github-actions
# Runners spec: https://docs.github.com/en/free-pro-team@latest/actions/reference/specifications-for-github-hosted-runners
# Glob expressions: https://github.com/actions/toolkit/tree/main/packages/glob

name: Ubuntu

###############################################################################
# Schedule:
# - push on any branch whose name matches v** or master
# - any pull request
###############################################################################
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "maintainer_doc/**"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "maintainer_doc/**"
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Arguments for the platform script:"
        required: true
        default: "-extent=x -parallel=p -jobs=2 -large=i -compcert=y -unimath=n -set-switch=y"

###############################################################################
# Least privilege: the jobs only need to read the repository.
# A new push to a pull request cancels the previous run of that PR
# (other events, e.g. schedule or push on main, are never cancelled).
###############################################################################
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

###############################################################################
# Platform script options shared among all jobs
###############################################################################
env:
  PLATFORM: -extent=x -parallel=p -jobs=2 -large=i -compcert=y -unimath=n -set-switch=y
  COQREGTESTING: y
  # Upstream servers (gitlab.mpi-sws.org, ...) answer HTTP 429 when all matrix jobs
  # download the same sources at once. opam default is 3 tries.
  OPAMRETRIES: 10

###############################################################################
# Ubuntu
#
# CAVEATS:
# - you need bubblewrap or the script fails
# - build-essential pulls in the C toolchain
###############################################################################
jobs:
  define_matrix:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          FULL='[ "9.2~2026.08", "9.1~2026.01","9.0~2025.08","8.20~2025.01","8.19~2024.10","8.18~2023.11","8.17~2023.08","8.16~2022.09","8.15~2022.04","8.14~2022.01","8.13~2021.02","8.12"]'
          SHORT='["9.2~2026.08", "9.1~2026.01"]'
          REST='["8.20~2025.01","8.19~2024.10","8.18~2023.11","8.17~2023.08","8.16~2022.09","8.15~2022.04","8.14~2022.01","8.13~2021.02","8.12"]'

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "variants=$FULL" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci:ubuntu-full') }}" == "true" ]]; then
            echo "variants=$REST" >> "$GITHUB_OUTPUT"
          else
            echo "variants=$SHORT" >> "$GITHUB_OUTPUT"
          fi
  Ubuntu_platform:
    name: Ubuntu ${{ matrix.variant }}
    needs: define_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.define_matrix.outputs.variants) }}

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disk usage after clean-up
        run: df -h

      - name: Set PLATFORM
        if: ${{ github.event.inputs.platform != '' }}
        run: echo "PLATFORM=${{ github.event.inputs.platform }}" >> $GITHUB_ENV

      - name: Install bubblewrap and build-essential
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential
          echo "=== Disk after apt install ==="
          df -h

      - name: Free additional disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h
          rm -rf ~/.cache/pip ~/.npm ~/.cache/npm || true
          if command -v docker >/dev/null 2>&1; then
            docker system prune -af || true
          fi
          echo "=== Disk after cleanup ==="
          df -h
          echo
          echo "=== Top 15 biggest directories in ~ ==="
          du -xhd1 ~ 2>/dev/null | sort -hr | head -n 15 || true

      - name: Disk usage before platform script
        run: |
          echo "=== Disk before coq_platform_make.sh ==="
          df -h
          df -i

      - name: Restore opam download cache
        # Only the downloaded source archives are cached (not the switch).
        # opam init keeps an existing ~/.opam/download-cache, so the platform
        # script can be left unchanged.
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam/download-cache
          key: opam-dl-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            opam-dl-${{ matrix.variant }}-

      - name: Run common platform script
        shell: bash
        run: |
          ARGS="${PLATFORM:-$PLATFORM_ARGS}"
          echo "Using ARGS=$ARGS"
          ./coq_platform_make.sh -packages=${{matrix.variant}} $ARGS -dumplogs

      - name: Save opam download cache
        # always(): a build that fails halfway keeps what it already downloaded
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.opam/download-cache
          key: opam-dl-${{ matrix.variant }}-${{ github.run_id }}

      - name: Disk usage after platform script
        if: always()
        run: |
          echo "=== Disk after coq_platform_make.sh ==="
          df -h
          df -i
          echo
          echo "=== du -sh ~/.opam (if exists) ==="
          du -sh ~/.opam || echo "no ~/.opam directory"
          echo
          echo "=== Top 20 biggest directories in ~/.opam (if exists) ==="
          du -xhd2 ~/.opam 2>/dev/null | sort -hr | head -n 20 || true

      - name: Create smoke test kit
        shell: bash
        run: |
          eval $(opam env)
          shell_scripts/create_smoke_test_kit.sh

      - name: "Run Linux smoke test kit"
        shell: bash
        run: |
          eval $(opam env)
          smoke-test-kit/run-smoke-test.sh

      - name: "Upload smoke test kit"
        uses: actions/upload-artifact@v4
        with:
          name: "Smoke Test Kit ${{matrix.variant}}"
          path: smoke-test-kit
          retention-days: 5
